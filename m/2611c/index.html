<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>UPSHIFT｜会議のまとめ</title>
<meta name="description" content="アップシフト合同会社の会議のまとめページです。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="アップシフト合同会社">
<meta property="og:title" content="UPSHIFT｜会議のまとめ">
<meta property="og:description" content="リンクを受け取った方専用のページです。">
<meta property="og:image" content="https://upshift-jp.github.io/notes/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&family=Cormorant+Garamond:wght@500;600&display=swap');
:root{--acc:#C4705A;--acc-d:#9E4F3B;--acc-l:#F6E3DC;--base:#FBF5EE;--base2:#F3EAE0;--sub:#5B6B7A;--next:#2F6FA8;--ink:#1A1A1A;--ink2:#3A3A3A;--mute:#5F5F5F;--line:#DDD5CB;--card:#FFFFFF;--ok:#3E8C6A;--sans:"Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;--serif:"Noto Serif JP","Hiragino Mincho ProN",serif;--latin:"Cormorant Garamond",serif}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#F1EEEA;--ink2:#D6D1CB;--mute:#ABA49C;--line:#3A352F;--card:#1E1B18;--base:#15130F;--base2:#24201B;--acc-l:#3A2A22;--sub:#9FB3C8}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--base);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.9;font-feature-settings:"palt" 1}
a{color:inherit}.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--base) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:6px;height:52px;overflow-x:auto;scrollbar-width:none}
.bar .logo{font-family:var(--latin);font-weight:600;letter-spacing:.28em;font-size:15px;margin-right:10px;white-space:nowrap}
.bar a.j{white-space:nowrap;text-decoration:none;font-size:14px;padding:4px 12px;border-radius:999px;color:var(--ink2)}
.bar a.j:hover{background:var(--acc-l)}
.cover{padding:44px 0 28px}
.kicker{font-size:13px;letter-spacing:.2em;color:var(--acc-d);font-weight:700}
@media (prefers-color-scheme:dark){.kicker{color:var(--acc)}}
h1{font-family:var(--serif);font-size:clamp(28px,6vw,40px);line-height:1.45;margin:10px 0 14px;letter-spacing:.03em}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--acc-l) 62%)}
.info{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:14.5px;color:var(--mute)}
.info b{color:var(--ink);font-weight:500;margin-left:6px}
.sum{margin-top:26px;background:var(--acc-l);border-radius:20px;padding:22px 22px 10px}
.sum li b{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--acc) 28%,transparent) 60%)}
.sum h2{font-size:15px;letter-spacing:.18em;margin:0 0 10px;color:var(--acc-d)}
@media (prefers-color-scheme:dark){.sum h2{color:var(--acc)}}
.sum ol{margin:0;padding:0;list-style:none;counter-reset:s}
.sum li{counter-increment:s;position:relative;padding:0 0 14px 44px;font-size:17.5px;line-height:1.75}
.sum li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-family:var(--latin);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center}
section{padding:40px 0 8px}
.st{display:flex;align-items:baseline;gap:14px;background:var(--acc-d);color:#fff;border-radius:12px;padding:12px 18px;margin-bottom:22px}
.st h2{font-family:var(--serif);font-size:clamp(21px,4.4vw,25px);margin:0;letter-spacing:.32em;color:#fff}
.st span{font-family:var(--latin);font-size:15px;letter-spacing:.22em;color:rgba(255,255,255,.82);margin-left:auto;text-transform:uppercase;white-space:nowrap}
#open .st{background:var(--next)}
#open .st::before{content:"NEXT";align-self:center;font-size:11.5px;font-weight:700;letter-spacing:.12em;background:#fff;color:var(--next);border-radius:999px;padding:1px 10px}
h3{font-size:17px;margin:30px 0 10px;padding-left:12px;border-left:4px solid var(--acc)}
.note{font-size:14.5px;color:var(--mute)}
.dec{list-style:none;margin:0;padding:0;counter-reset:d}
.dec li{counter-increment:d;display:grid;grid-template-columns:52px 1fr;gap:4px 10px;padding:16px 0;border-bottom:1px solid var(--line)}
.dec li::before{content:counter(d,decimal-leading-zero);font-family:var(--latin);font-weight:600;font-size:30px;line-height:1;color:var(--acc);padding-top:2px}
.dec b{font-size:18px;line-height:1.6;display:block}
.dec p{margin:4px 0 0;font-size:15.5px;color:var(--ink2);line-height:1.8}
.dec li.top{background:var(--acc-l);border-radius:16px;padding:16px 14px;border-bottom:0;margin-bottom:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;padding:1px 10px;border-radius:999px;background:var(--acc);color:#fff;margin-left:8px;vertical-align:3px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer}
.tools button.on{background:var(--ink);color:var(--base);border-color:var(--ink)}
.tools .copy{margin-left:auto;border-color:var(--acc);color:var(--acc-d)}
@media (prefers-color-scheme:dark){.tools .copy{color:var(--acc)}}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.tasks input{width:22px;height:22px;margin:4px 0 0;accent-color:var(--acc)}
.tasks .tx{font-size:16.5px;line-height:1.7}
.tasks .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tasks .who,.tasks .due{font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px}
.tasks .who{background:var(--base2);color:var(--sub)}
.tasks .due{background:var(--acc-l);color:var(--acc-d)}
@media (prefers-color-scheme:dark){.tasks .due{color:var(--acc)}}
.tasks li.done .tx{color:var(--mute);text-decoration:line-through}
.tasks li[hidden]{display:none}
.toast{font-size:13.5px;color:var(--ok);margin-left:8px}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 8px}
.tl li::before{content:"";position:absolute;left:-30px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--line)}
.tl li.main::before{border-color:var(--acc);background:var(--acc)}
.tl .d{font-family:var(--latin);font-weight:600;font-size:22px;margin-right:10px}
.tl .d small{font-family:var(--sans);font-size:13px;color:var(--mute);margin-left:2px}
.tl p{margin:0;font-size:15.5px}
.play{display:inline-flex;align-items:center;gap:10px;text-decoration:none;background:var(--ink);color:var(--base)!important;border-radius:999px;padding:8px 20px 8px 10px;font-weight:700;font-size:15.5px}
.play i{width:30px;height:30px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-style:normal}
.ch{margin-top:16px;border-top:1px solid var(--line)}
.ch details{border-bottom:1px solid var(--line)}
.ch summary{list-style:none;display:grid;grid-template-columns:62px 1fr 22px;gap:10px;align-items:center;padding:12px 2px;cursor:pointer}
.ch summary::-webkit-details-marker{display:none}
.ch .t{font-family:var(--latin);font-weight:600;font-size:18px;color:var(--sub);text-decoration:none}
.ch .t:hover{color:var(--acc)}
.ch .x{font-size:16.5px;line-height:1.6}
.ch .x .tag{font-size:11px}
.ch .ar{transition:transform .2s;color:var(--mute);text-align:center}
.ch details[open] .ar{transform:rotate(90deg)}
.ch .body{padding:0 0 14px 72px}
.ch .body ul{margin:0;padding-left:1.1em}.ch .body li{font-size:15.5px;margin-bottom:4px;line-height:1.8}
.ch .body li::marker{color:var(--acc)}
.ch .who2{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.q{display:block;border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:6px 0;font-family:var(--serif);font-size:16px}
@media (max-width:560px){.ch .body{padding-left:4px}}
.open{list-style:none;margin:0;padding:0}
.open li{padding:12px 0 12px 36px;border-bottom:1px dashed var(--line);position:relative;font-size:16.5px}
.open li::before{content:"?";position:absolute;left:0;top:14px;width:24px;height:24px;border-radius:6px;background:var(--next);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.tbl{overflow-x:auto;margin:6px 0 4px;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:15.5px;line-height:1.7}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl thead th{font-size:14px;color:var(--mute);font-weight:700;border-bottom:2px solid var(--ink)}
.tbl thead th.rec{background:var(--acc-l);color:var(--acc-d);border-radius:10px 10px 0 0}
.tbl tbody th{font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap;width:8em}
.tbl td.rec{background:color-mix(in srgb,var(--acc-l) 55%,transparent)}
.tbl b{font-size:17px}
.bars{margin:6px 0 4px}
.bars .row{display:grid;grid-template-columns:7.5em 1fr;gap:10px;align-items:center;margin:10px 0}
.bars .lb{font-size:14.5px;font-weight:700;color:var(--ink2)}
.bars .bg{background:var(--base2);border-radius:8px;height:38px;position:relative}
.bars .fill{height:100%;border-radius:8px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:700;font-size:15.5px;white-space:nowrap}
.bars .gray{background:#8A8178}.bars .hot{background:var(--acc)}
.bars .gap{font-size:15px;margin:6px 0 0 calc(7.5em + 10px)}
.bars .gap b{color:var(--acc-d);font-size:19px}
@media (prefers-color-scheme:dark){.bars .gap b{color:var(--acc)}}
.fig{margin:8px 0 4px}.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:13.5px;color:var(--mute);margin-top:4px}
.fig .tall{display:none}
footer{margin:48px 0 0;padding:26px 0 40px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute)}
footer .co{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline;margin-bottom:8px}
footer .co b{font-family:var(--latin);letter-spacing:.28em;font-size:16px;color:var(--ink)}
@media (max-width:600px){.st{padding:11px 14px;gap:10px}.st h2{white-space:nowrap;letter-spacing:.16em;font-size:20px}.st span{display:none}
.tbl table{min-width:0;font-size:14.5px}.tbl th,.tbl td{padding:9px 7px}.tbl tbody th{width:auto;white-space:normal}
.bars .row{grid-template-columns:1fr;gap:4px}.bars .gap{margin-left:0}
.fig .wide{display:none}.fig .tall{display:block;max-width:380px;margin:0 auto}}
@media print{.bar,.tools{display:none}.ch .body{display:block!important}body{background:#fff;font-size:12pt}section{break-inside:avoid-page}}
.pdfbtn{font:inherit;font-size:14px;margin-top:22px;border:1px solid var(--acc);background:var(--card);color:var(--acc-d);border-radius:999px;padding:5px 16px;cursor:pointer}
@media print{.pdfbtn{display:none}}
@media print{section{break-inside:auto}.dec li,.tasks li,.tl li,.ch details,.tbl tr,.open li,.sum{break-inside:avoid}.st,h3{break-after:avoid}}

.gate{padding:80px 0;text-align:center;color:var(--mute)}
.gate b{display:block;font-family:var(--latin);letter-spacing:.3em;color:var(--acc-d);margin-bottom:10px}
</style>
</head>
<body data-theme="a">
<nav class="bar"><div class="wrap"><span class="logo">UPSHIFT</span><a class="j" href="#dec">決まったこと</a><a class="j" href="#todo">宿題と日程</a><a class="j" href="#flow">録画と流れ</a><a class="j" href="#open">これから</a></div></nav>
<main class="wrap" id="app"><div class="gate"><b>UPSHIFT</b><span id="gm">会議のまとめを表示しています…</span></div></main>
<div class="wrap"><footer>
<div class="co"><b>UPSHIFT</b><span>アップシフト合同会社</span><span><a href="https://upshift.jp/">https://upshift.jp/</a></span></div>
東京都八王子市を拠点に、補助金・助成金を活用した中小企業の事業支援を行っています。このページは、会議の参加者向けにお送りしたまとめです。
</footer></div>
<script>
(function(){
var gm=document.getElementById('gm');
function msg(t){gm.textContent=t;}
var k=new URLSearchParams(location.hash.slice(1)).get('k');
if(!k||!window.crypto||!crypto.subtle){msg('このページは、お送りしたリンクから開いてください。');return;}
function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function open(url){
 var j=await (await fetch(url,{cache:'no-store'})).json();
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(k),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.s),iterations:j.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.i)},key,b64(j.c));
}
open('note.json').then(function(buf){
 var d=JSON.parse(new TextDecoder().decode(buf));
 document.getElementById('app').innerHTML=d.html;
 document.title=d.title;
 init(d);
}).catch(function(){msg('このリンクでは開けません。お手数ですが送り主にお問い合わせください。');});

function init(d){
 var st={};try{st=JSON.parse(localStorage.getItem(d.store)||'{}')}catch(e){}
 function save(){try{localStorage.setItem(d.store,JSON.stringify(st))}catch(e){}}
 var items=[].slice.call(document.querySelectorAll('#tasks li'));
 items.forEach(function(li,i){var cb=li.querySelector('input');if(!cb)return;if(st[i]){cb.checked=true;li.classList.add('done')}
  cb.addEventListener('change',function(){li.classList.toggle('done',cb.checked);st[i]=cb.checked;save()})});
 document.querySelectorAll('.tools [data-f]').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.tools [data-f]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
  var f=b.dataset.f;items.forEach(function(li){li.hidden=!(f==='all'||li.dataset.w===f)})})});
 var cp=document.getElementById('copy');
 if(cp)cp.addEventListener('click',function(){
  var t='【宿題】'+d.copy+'\n'+items.filter(function(li){return !li.hidden}).map(function(li){
   var m=[].map.call(li.querySelectorAll('.m span'),function(s){return s.textContent}).join('・');
   return (li.classList.contains('done')?'☑ ':'□ ')+li.querySelector('.tx').textContent+'（'+m+'）'}).join('\n');
  var toast=document.getElementById('toast');
  try{navigator.clipboard.writeText(t).then(function(){toast.textContent='コピーしました'},function(){toast.textContent='コピーできませんでした'})}catch(e){toast.textContent='コピーできませんでした'}
  setTimeout(function(){toast.textContent=''},2500)});
 document.querySelectorAll('.ch summary a.t').forEach(function(a){a.addEventListener('click',function(e){e.stopPropagation()})});
 var pb=document.getElementById('pdfbtn');
 if(pb){pb.hidden=false;pb.addEventListener('click',async function(){pb.textContent='準備中…';try{var buf=await open('note.pdf.json');
  var url=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));var a=document.createElement('a');a.href=url;a.download=d.pdf;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000);pb.textContent='PDFで保存';}catch(e){pb.textContent='保存できませんでした';}});}
 if(location.hash.indexOf('&')<0){}
}
})();
</script>
</body></html>
