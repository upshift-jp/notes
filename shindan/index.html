<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="ウチ、もらえる？診断｜30秒で取り逃がし額をチェック">
<meta property="og:description" content="8つの質問に答えるだけで、御社が使える補助金・助成金と推定額がわかります。アップシフト合同会社">
<title>ウチ、もらえる？診断｜アップシフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2430; --navy:#0b6bcb; --navy2:#0a5bb0; --accent:#f25c05; --accent-soft:#fff1e6;
  --bg:#f2f7ff; --card:#fff; --line:#d6e2f0; --muted:#4f5d6b; --ok:#0f9d58;
  --c1:#0b6bcb; --c2:#0d9e73; --c3:#f25c05; --c4:#b8860b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Kaku Gothic New",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-weight:500;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header.top{background:var(--navy);color:#fff}
header.top .wrap{padding:14px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;letter-spacing:.06em;font-size:15px}
.logo span{color:#ffd84d}
.tag{font-size:11px;opacity:.75;margin-left:auto}

.hero{padding:36px 0 22px;text-align:center}
.eyebrow{display:inline-block;font-size:13px;font-weight:700;color:#b34100;background:var(--accent-soft);padding:3px 12px;border-radius:999px;letter-spacing:.08em}
.hero h1{font-size:clamp(24px,5.4vw,34px);font-weight:900;line-height:1.35;margin:14px 0 10px}
.hero h1 em{font-style:normal;color:var(--navy);background:linear-gradient(transparent 60%,#ffe866 60%)}
.hero p{font-size:14px;color:var(--muted)}
.brandname{font-weight:900;font-size:22px;color:var(--navy);margin-bottom:10px;letter-spacing:.02em}
.brandname span{color:var(--accent);margin-left:2px}
.flow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.flow div{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.flow b{color:var(--navy2)}

.progress{position:sticky;top:0;z-index:5;background:rgba(244,246,249,.94);backdrop-filter:blur(6px);padding:10px 0}
.bar{height:6px;background:#e3e8ee;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.progress small{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px}

.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:14px;transition:border-color .2s}
.q.done{border-color:#8fc1f0}
.q h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.q h2 .n{font-family:Inter,sans-serif;font-size:12px;color:#fff;background:var(--navy);border-radius:6px;padding:2px 7px}
.q.done h2 .n{background:var(--ok)}
.q .hint{font-size:12px;color:var(--muted);margin:2px 0 0 42px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opt{font:inherit;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;transition:all .15s}
.opt:hover{border-color:var(--navy);background:#eaf3ff}
.opt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

.submit{margin-top:24px;text-align:center}
.btn{font:inherit;font-weight:900;font-size:17px;border:0;border-radius:12px;padding:16px 20px;width:100%;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 0 #c24700;transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c24700}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.submit small{display:block;font-size:12px;color:var(--muted);margin-top:10px}

/* result */
#result{display:none;padding-top:28px}
.res-head{background:var(--navy);color:#fff;border-radius:18px;padding:28px 20px;text-align:center;position:relative;overflow:hidden}
.res-head::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06)}
.res-head p{font-size:14px;opacity:.85}
.amount{font-family:Inter,sans-serif;font-weight:800;font-size:clamp(44px,12vw,68px);line-height:1.1;margin:8px 0 2px;color:#ffe866}
.amount small{font-family:"Zen Kaku Gothic New";font-size:20px;font-weight:700;color:#fff;margin-left:4px}
.res-head .sub{font-size:12px;opacity:.7}

.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.sec h3{font-size:15px;font-weight:900;margin-bottom:12px}
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;background:#eef1f4}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-family:Inter,sans-serif;font-size:13px}
.legend .src{display:block;font-size:11px;color:var(--muted)}

.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0;padding-top:0}
.item .row{display:flex;gap:10px;align-items:baseline}
.chip{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:1px 7px;flex:none}
.item h4{font-size:15px;font-weight:700}
.item .amt{margin-left:auto;font-family:Inter,sans-serif;font-weight:800;color:var(--navy);white-space:nowrap;font-size:15px}
.item .amt.na{font-family:inherit;font-size:12px;color:var(--muted);font-weight:500}
.item p{font-size:13px;color:var(--muted);margin-top:4px}
.item .why{font-size:12px;color:var(--navy2);margin-top:4px}
.stchip{font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin-left:6px;border:1px solid}
.stchip.open{color:#1a8a5a;border-color:#9fd3b9;background:#eef8f2}
.stchip.end{color:#b3261e;border-color:#f0b4ae;background:#fdecea;margin-left:0}
.item .stchip.end{margin-left:6px}
.stchip.next{color:#1f4f7d;border-color:#a9c1db;background:#edf3fa;margin-left:0}
.item .stchip.next{margin-left:6px}
.tm{font-size:13px;line-height:1.8;margin-top:8px}
.item .grp{font-size:11px;color:var(--accent)}

.msg{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;font-size:14px;margin-top:14px}
.msg b{color:#b34100}
.cta{background:var(--navy);color:#fff;border-radius:16px;padding:22px 18px;margin-top:18px;text-align:center}
.cta h3{font-size:18px;font-weight:900}
.cta p{font-size:13px;opacity:.85;margin:6px 0 14px}
.cta a{display:block;text-decoration:none;font-weight:900;border-radius:10px;padding:14px;margin-top:10px}
.cta .line{background:#06c755;color:#fff}
.cta .book{background:#fff;color:var(--navy)}
.cta .off{opacity:.45;pointer-events:none}
.lf{background:#fff;color:var(--ink);border-radius:12px;padding:16px;text-align:left;display:grid;gap:12px}
.lf label{display:block;font-size:13px;font-weight:700}
.lf input:not([type=checkbox]),.lf textarea{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;font-weight:400;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
.lf input:focus,.lf textarea:focus{outline:none;border-color:var(--navy2)}
.req,.opt2{font-size:10px;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:4px;color:#fff;background:var(--accent);vertical-align:2px}
.opt2{background:#9aa5b1}
.lf .agree{font-size:12px;font-weight:400;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lf .agree input{margin-top:4px;width:16px;height:16px;flex:none}
.lf .btn{margin-top:4px}
.ferr{color:#c0392b;font-size:13px;min-height:0}
.thanks{background:#fff;color:var(--ink);border-radius:12px;padding:22px 16px}
.thanks .big{font-size:20px;font-weight:900;color:var(--ok)}
.thanks p{font-size:13px;color:var(--muted);margin:6px 0 0;opacity:1}
.cta .alt{font-size:12px;opacity:.75;margin-top:16px}
.notes{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.8}
.again{display:block;margin:18px auto 0;font:inherit;font-size:14px;background:none;border:0;color:var(--navy2);text-decoration:underline;cursor:pointer}
footer{text-align:center;font-size:11px;color:var(--muted);padding:20px 0}
@media (max-width:480px){.legend{grid-template-columns:1fr}.q .hint{margin-left:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="logo">UP<span>SHIFT</span></div><div class="tag">経営の初速を上げ、事業を加速する</div></div></header>

<main class="wrap">
  <div id="form">
    <section class="hero">
      <div class="brandname">ウチ、もらえる？<span>診断</span></div>
      <span class="eyebrow">8つの質問・約30秒</span>
      <h1>あなたの会社が<br><em>取り逃がしている</em>お金はいくら？</h1>
      <p>法人税・雇用保険料・地方税など、すでに納めているお金は<br>補助金・助成金・奨励金・税制優遇として「戻ってくる」可能性があります。</p>
      <div class="flow">
        <div>法人税など → <b>国の補助金・税制</b></div>
        <div>雇用保険料 → <b>助成金</b></div>
        <div>都税など → <b>自治体の助成・奨励金</b></div>
      </div>
    </section>
    <div class="progress"><div class="bar"><i id="pbar"></i></div><small id="ptext">0 / 8 回答済み</small></div>
    <div id="questions"></div>
    <div class="submit">
      <button class="btn" id="go" disabled>取り逃がし額を診断する</button>
      <small id="gohint">8問すべてに答えると診断できます</small>
    </div>
  </div>

  <div id="result"></div>
</main>
<footer>© アップシフト合同会社（東京都八王子市）</footer>

<script>
/* ============================================================
   設定：公開前にここを差し替えてください
   ============================================================ */
const CONFIG = {
  endpoint: "",     // Apps ScriptのウェブアプリURL（…/exec）。設定すると見込み客リストに保存されます
  lineUrl: "",      // 例: https://lin.ee/xxxxxxx （空なら「準備中」表示）
  bookingUrl: "",   // 例: 日程調整ページのURL
};

/* ============================================================
   質問
   ============================================================ */
const Q = [
  {id:"pref", t:"会社の所在地は？", o:["東京都","神奈川県","埼玉県","千葉県","大阪府","愛知県","福岡県","その他の道府県"]},
  {id:"emp", t:"従業員数は？", h:"役員を除く。パート・アルバイトを含む雇用保険加入者の目安", o:["0名","1〜5名","6〜20名","21〜50名","51名以上"]},
  {id:"ind", t:"業種に一番近いのは？", o:["製造・建設・運輸","小売・卸・EC","サービス・飲食","宿泊・観光","福祉・介護","IT・情報通信","その他"]},
  {id:"rev", t:"年商の規模は？", o:["〜3千万円","3千万〜1億円","1〜3億円","3〜10億円","10億円以上"]},
  {id:"pl", t:"直近期の損益は？", o:["黒字","赤字","創業1年目（決算前）"]},
  {id:"plan", t:"今後1〜2年に予定していることは？", h:"あてはまるものをすべて選択", multi:true, o:["設備・機械の導入","省力化・自動化","ITツール・AI導入","新事業・新商品","店舗改装・新築","新しい販路・EC強化","賃上げ","正社員化・採用","AI研修・DX研修","その他の社員研修","働き方改革（残業削減・休暇）","育児・介護との両立","シニア人材の活躍","特になし"]},
  {id:"fund", t:"借入・資金調達は？", o:["予定・検討あり","すでに借入がある","予定なし"]},
  {id:"age", t:"創業からの年数は？", o:["1年未満","1〜3年","3〜5年","5〜10年","10年以上"]},
];
const A = {}; // answers

/* ============================================================
   制度データ（金額は「上限・最大額ベースの目安」）
   ※ 公開前に必ず最新の公募要領・支給要領で確認・更新すること
   cat: hojo=国の補助金 / jyosei=助成金(雇用保険財源) / jichi=自治体 / zei=税制
   合計額：該当制度の上限額をすべて合算（国・都道府県の併用可。同一経費への重複補助は不可）
   ============================================================ */
const CAT = {
  hojo:{name:"国の補助金", src:"財源：法人税などの国税", color:"var(--c1)"},
  jyosei:{name:"助成金", src:"財源：雇用保険料（事業主負担分）", color:"var(--c2)"},
  jichi:{name:"自治体の助成・奨励金", src:"財源：都道府県・市区町村の税", color:"var(--c3)"},
  zei:{name:"税制優遇", src:"納める法人税そのものが減る", color:"var(--c4)"},
};
const ST = { open:"令和8年度 受付中", end:"2026年度で終了予定・お早めに", next:"2027年度 拡充予定" };
const EMP_IDX = {"0名":0,"1〜5名":1,"6〜20名":2,"21〜50名":3,"51名以上":4};
const has = p => (A.plan||[]).includes(p);
const any = (...ps) => ps.some(has);
const ei = () => EMP_IDX[A.emp];
const young = () => ["1年未満","1〜3年","3〜5年"].includes(A.age);
const firstYear = () => A.pl==="創業1年目（決算前）" || A.age==="1年未満";

const PROGRAMS = [
  { name:"小規模事業者持続化補助金", cat:"hojo",
    desc:"販路開拓・店舗改装・広告などの経費を2/3補助。",
    ok:()=>{ const lim = ["製造・建設・運輸","宿泊・観光"].includes(A.ind)?20:5;
             const n=[0,5,20,50,51][ei()]; return n<=lim && any("新しい販路・EC強化","店舗改装・新築","新事業・新商品","設備・機械の導入"); },
    amt:()=> has("賃上げ")?250:100,
    why:()=> has("賃上げ")?"小規模事業者×販路開拓。賃上げ特例・インボイス特例の上乗せを含む最大額":"小規模事業者×販路開拓。インボイス特例の上乗せを含む最大額" },

  { name:"新事業進出・ものづくり補助金", cat:"hojo", group:"setsubi",
    desc:"革新的な新製品・新サービス、新市場への進出に伴う設備投資を補助。",
    ok:()=> !firstYear() && any("新事業・新商品","設備・機械の導入"),
    amt:()=> has("新事業・新商品") ? [2500,2500,2500,4000,7000][ei()] : [750,750,1000,1500,2500][ei()],
    why:()=> has("新事業・新商品")?"新事業・新商品の予定あり（新事業進出枠の従業員規模別上限）":"設備投資の予定あり（革新的新製品・サービス枠の従業員規模別上限）" },

  { name:"中小企業省力化投資補助金（一般型）", cat:"hojo", group:"setsubi",
    desc:"人手不足解消のためのオーダーメイドの省力化設備・システムを補助。",
    ok:()=> ei()>=1 && any("省力化・自動化","設備・機械の導入"),
    amt:()=> [750,750,1500,3000,5000][ei()],
    why:()=>"省力化・設備投資の予定あり（従業員規模別上限）" },

  { name:"デジタル化・AI導入補助金", cat:"hojo",
    desc:"業務効率化・売上アップにつながるITツール・AI搭載ツールの導入費用を補助（旧IT導入補助金）。",
    ok:()=> any("ITツール・AI導入","新しい販路・EC強化","省力化・自動化"),
    amt:()=> 450,
    why:()=>"ITツール・AI導入／EC強化／省力化の予定あり（通常枠の上限の目安）" },

  { name:"中小企業成長加速化補助金", cat:"hojo", group:"setsubi",
    desc:"売上100億円を目指す企業の大型投資（1億円以上）を補助。",
    ok:()=> A.rev==="10億円以上" && any("設備・機械の導入","店舗改装・新築","省力化・自動化","新事業・新商品"),
    amt:()=> 50000,
    why:()=>"年商10億円以上×大型投資" },

  /* ---- 助成金（厚生労働省・雇用保険財源）令和8年度の内容＋令和9年度の動き ---- */
  { name:"キャリアアップ助成金（正社員化コース）", cat:"jyosei", st:"open",
    desc:"有期・パート等を正社員に転換すると1人あたり定額を助成。令和8年度は情報公表加算が新設。",
    ok:()=> ei()>=1 && any("正社員化・採用"),
    amt:()=> 80*[0,1,2,4,6][ei()],
    why:()=>`正社員化の予定あり（1人最大80万円 × ${[0,1,2,4,6][ei()]}人想定、加算は別）` },

  { name:"業務改善助成金", cat:"jyosei", st:"next",
    desc:"事業場内最低賃金を50円以上引き上げ、生産性向上の設備投資等を行うと費用の最大4/5を助成。",
    ok:()=> ei()>=1 && any("賃上げ","設備・機械の導入","省力化・自動化","ITツール・AI導入"),
    amt:()=> [0,240,450,600,600][ei()],
    why:()=>"賃上げ×設備投資（90円コースの人数別上限の目安）。令和8年度分は地域の最低賃金発効日前日または11月末で締切。令和9年度は予算を大幅増額し上限引上げを要求中" },

  { name:"働き方改革推進支援助成金（労働時間短縮・年休促進支援コース）", cat:"jyosei", st:"open",
    desc:"残業削減・休暇取得促進のための設備・システム導入、専門家活用などを助成。賃上げ加算あり。",
    ok:()=> ei()>=1 && any("働き方改革（残業削減・休暇）","省力化・自動化","ITツール・AI導入"),
    amt:()=> 150 + (has("賃上げ") ? [0,60,240,480,720][ei()] : 0),
    why:()=> has("賃上げ")?"働き方改革×賃上げ（基本上限150万円＋賃上げ加算の目安）":"働き方改革・省力化の予定あり（基本上限150万円）" },

  { name:"両立支援等助成金（出生時両立支援コース）", cat:"jyosei", st:"open",
    desc:"男性の育児休業取得を進める職場づくりと、取得率の上昇を助成。",
    ok:()=> ei()>=1 && has("育児・介護との両立"),
    amt:()=> 80, why:()=>"育児との両立支援の予定あり（取得時・取得率上昇の合計の目安）" },

  { name:"両立支援等助成金（育児休業等支援コース）", cat:"jyosei", st:"open",
    desc:"育休の取得・職場復帰をプランに沿って支援した中小企業を助成。",
    ok:()=> ei()>=1 && has("育児・介護との両立"),
    amt:()=> 126, why:()=>"育児との両立支援の予定あり（2名分＋情報公表加算の最大額）" },

  { name:"両立支援等助成金（育休中等業務代替支援コース）", cat:"jyosei", st:"open",
    desc:"育休・短時間勤務中の業務を代替する人の新規雇用や手当支給を助成。令和8年度に拡充。",
    ok:()=> ei()>=1 && has("育児・介護との両立"),

const qWrap = document.getElementById("questions");
Q.forEach((q,i)=>{
  const s=document.createElement("section"); s.className="q"; s.id="q-"+q.id;
  s.innerHTML=`<h2><span class="n">Q${i+1}</span>${q.t}</h2>${q.h?`<div class="hint">${q.h}</div>`:""}<div class="opts"></div>`;
  const box=s.querySelector(".opts");
  q.o.forEach(v=>{
    const b=document.createElement("button"); b.type="button"; b.className="opt"; b.textContent=v; b.setAttribute("aria-pressed","false");
    b.onclick=()=>pick(q,v,s); box.appendChild(b);
  });
  qWrap.appendChild(s);
});

function pick(q,v,s){
  if(q.multi){
    let cur=A[q.id]||[];
    if(v==="特になし") cur = cur.includes(v)?[]:[v];
    else { cur=cur.filter(x=>x!=="特になし"); cur = cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]; }
    A[q.id]=cur.length?cur:undefined;
  } else {
    const first = A[q.id]===undefined; A[q.id]=v;
    if(first){ const i=Q.indexOf(q); const nx=document.getElementById("q-"+(Q[i+1]||{}).id);
      if(nx) setTimeout(()=>nx.scrollIntoView({behavior:"smooth",block:"center"}),150); }
  }
  s.querySelectorAll(".opt").forEach(b=>{
    const on = q.multi ? (A[q.id]||[]).includes(b.textContent) : A[q.id]===b.textContent;
    b.setAttribute("aria-pressed",on);
  });
  s.classList.toggle("done", A[q.id]!==undefined);
  update();
}
function update(){
  const n=Q.filter(q=>A[q.id]!==undefined).length;
  document.getElementById("pbar").style.width=(n/Q.length*100)+"%";
  document.getElementById("ptext").textContent=`${n} / ${Q.length} 回答済み`;
  const go=document.getElementById("go"); go.disabled = n<Q.length;
  document.getElementById("gohint").textContent = n<Q.length?`あと${Q.length-n}問で診断できます`:"準備ができました";
}

let LAST = null;
// 流入元（URL末尾の ?src=gaia など）を取得
let SRC = "";
try { SRC = new URLSearchParams(location.search).get("src") || ""; } catch(e){}
try { if(window.google && google.script && google.script.url){ google.script.url.getLocation(l=>{ SRC = (l.parameter && l.parameter.src) || SRC; }); } } catch(e){}
function sendLead(e){
  e.preventDefault();
  const f=e.target, err=document.getElementById("ferr"), btn=document.getElementById("sendBtn");
  const v=k=>(f.elements[k].value||"").trim();
  const miss=[];
  if(!v("company")) miss.push("会社名"); if(!v("name")) miss.push("お名前");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email"))) miss.push("メールアドレス");
  if(v("tel") && v("tel").replace(/[^\d]/g,"").length<10) miss.push("電話番号（10桁以上）");
  if(!f.elements.agree.checked) miss.push("同意のチェック");
  if(miss.length){ err.textContent="入力をご確認ください："+miss.join("、"); return; }
  err.textContent="";
  const payload = {
    company:v("company"), name:v("name"), email:v("email"), tel:v("tel"), staff:v("staff"), note:v("note"),
    totalMan: LAST.total, totalText: yen(LAST.total)+"円",
    answers: Q.map(q=>({q:q.t, a:Array.isArray(A[q.id])?A[q.id].join("・"):A[q.id]})),
    programs: LAST.hits, byCat: LAST.byCat, src: SRC, ua: navigator.userAgent.slice(0,200)
  };
  const done=()=>{ f.hidden=true; document.getElementById("thanks").hidden=false; };
  const fail=m=>{ btn.disabled=false; btn.textContent="無料で個別アドバイスを受け取る"; err.textContent=m; };
  btn.disabled=true; btn.textContent="送信中…";
  if(window.google && google.script && google.script.run){
    google.script.run.withSuccessHandler(res=> res&&res.ok?done():fail(res&&res.error||"送信に失敗しました。時間をおいて再度お試しください。"))
      .withFailureHandler(()=>fail("送信に失敗しました。時間をおいて再度お試しください。")).submitLead(payload);
  } else if(CONFIG.endpoint){
    fetch(CONFIG.endpoint,{method:"POST",body:JSON.stringify(payload)})
      .then(r=>r.json()).then(res=> res&&res.ok?done():fail(res&&res.error||"送信に失敗しました。時間をおいて再度お試しください。"))
      .catch(()=>fail("送信に失敗しました。時間をおいて再度お試しください。"));
  } else {
    // プレビュー環境（Apps Script以外）では送信しない
    // 送信先（CONFIG.endpoint）が未設定のとき
    setTimeout(()=>fail("ただいま受付の準備中です。恐れ入りますが、しばらくしてから再度お試しください。"),400);
  }
}

const yen = man => man>=10000 ? (man/10000).toLocaleString("ja-JP",{maximumFractionDigits:1})+"億" : man.toLocaleString("ja-JP")+"万";

document.getElementById("go").onclick=()=>{
  const hits = PROGRAMS.filter(p=>{try{return p.ok()}catch(e){return false}})
    .map(p=>({...p, v:p.amt(), w:p.why(), d: typeof p.desc==="function"?p.desc():p.desc}));
  // 東京都以外の説明文は回答後に生成
  hits.forEach(h=>{ if(h.name.startsWith("都道府県")) h.d=`${A.pref}や市区町村にも、設備投資・販路開拓・人材育成などの独自制度があります。`; });

  // 併用不可グループは最大の1件のみ計上
  const best={}; hits.forEach(h=>{ if(h.group && h.v){ if(!best[h.group]||h.v>best[h.group].v) best[h.group]=h; }});
  hits.forEach(h=>{ h.counted = !!h.v; });

  const byCat={}; Object.keys(CAT).forEach(k=>byCat[k]=0);
  hits.forEach(h=>{ if(h.counted) byCat[h.cat]+=h.v; });
  const total=Object.values(byCat).reduce((a,b)=>a+b,0);
  render(hits,byCat,total);
};

  return `<div class="sec"><h3>時期で差がつく制度</h3>
    ${end.length?`<p class="tm"><span class="stchip end">2026年度で終了予定</span> ${end.map(x=>x.name).join("、")}<br>令和8年度末（2027年3月）までに計画届・申請の準備が必要です。</p>`:""}
    ${nx.length?`<p class="tm"><span class="stchip next">2027年度 拡充予定</span> ${nx.map(x=>x.name).join("、")}<br>国の令和9年度概算要求で増額・上限引上げが示されています（予算成立前のため内容は変わる可能性があります）。今から賃上げ計画と投資計画を準備しておくと有利です。</p>`:""}
  </div>`;
}

  const el=document.getElementById("cnt"), target= total>=10000? total/10000 : total, t0=performance.now(), dur=1100;
  const fmt=v=> total>=10000? v.toLocaleString("ja-JP",{maximumFractionDigits:1}) : Math.round(v).toLocaleString("ja-JP");
  (function tick(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmt(target*e); if(p<1) requestAnimationFrame(tick); })(t0);
}
</script>
</body>
</html>
